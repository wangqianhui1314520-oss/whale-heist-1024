<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071626">
  <meta name="description" content="鲸鱼魔盗团：操控鲸尾少女，与三名 AI 队友潜入海底机房。五章合作解谜，带着数据全员返航。">
  <title>鲸鱼魔盗团</title>
  <link rel="icon" type="image/png" href="assets/ui/whale-emblem.webp">
  <link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
  <main id="game-shell" class="game-shell" aria-label="鲸鱼魔盗团游戏">
    <canvas id="background-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <canvas id="structure-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <canvas id="game-canvas" width="1280" height="720" tabindex="0" aria-label="游戏画面。使用 A D 移动，空格跳跃，Shift 冲刺，E 互动，数字键选择队友。"></canvas>
    <canvas id="effects-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div id="scene-labels" class="scene-labels" aria-hidden="true"></div>
    <div id="ui-root" class="ui-root"></div>
    <div id="menu-root" class="menu-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="dialogue-root" class="dialogue-root" role="status" aria-live="polite"></div>
  </main>
  <aside class="rotate-hint" aria-label="请横屏游玩"><div class="rotate-device">↻</div><img src="assets/ui/whale-emblem.webp" alt=""><h1>鲸鱼魔盗团</h1><p>转动设备，展开这片深蓝。</p><small>横屏后即可开始行动</small></aside>
  <noscript><div class="no-script">请启用 JavaScript，以开始《鲸鱼魔盗团》。</div></noscript>
  <script type="module" src="src/main.mjs"></script>
</body>
</html>
